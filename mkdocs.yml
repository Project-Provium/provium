site_name: Provium
site_description: Typed artifacts with automatic provenance
site_url: https://project-provium.github.io/provium/
repo_url: https://github.com/Project-Provium/provium
repo_name: Project-Provium/provium

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Artifacts: guides/artifacts.md
      - Procedures and provenance: guides/procedures.md
      - Dumping and loading: guides/transfers.md
      - Local and S3 files: guides/storage.md
      - Provenance graphs: guides/graphing.md
      - Command-line tools: guides/cli.md
      - Pipelines: guides/pipelines.md
  - API reference:
      - Provium core: reference/provium.md
      - Provium CLI: reference/provium-cli.md
      - Provium Pipeline: reference/provium-pipeline.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            filters:
              - "!^_"
            heading_level: 2
            members_order: source
            show_root_heading: true
            show_source: false
