[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "provium-pipeline"
version = "2.1.0"
description = "Provenance-addressed local and PostgreSQL-backed procedure pipelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core releases keep this minimum aligned with the tested workspace version.
    "provium>=0.12.0", # x-release-please-version
    "pydantic>=2.10,<3",
    "PyYAML>=6",
]

[project.entry-points."provium.cli.command_catalogs"]
pipeline = "provium_pipeline.cli:plugin"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
s3 = ["boto3>=1.35"]
test = ["psycopg[binary]>=3.2", "boto3>=1.35", "pytest>=8.3", "pytest-cov>=6", "ruff>=0.16", "pyright>=1.1.411", "build>=1.2", "types-PyYAML>=6", "boto3-stubs[s3]>=1.35"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
provium_pipeline = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src", "../provium/test"]
addopts = ["--strict-config", "--strict-markers"]

[tool.pyright]
include = ["src"]
extraPaths = ["src", "../provium/src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnnecessaryIsInstance = "none"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "TRY", "UP"]
ignore = ["TRY003"]
