[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "provium"
version = "0.8.0"
description = "Typed artifacts with automatic provenance"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "argcomplete>=3,<4",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
]

[project.scripts]
provium = "provium.cli:main"

[project.urls]
Homepage = "https://github.com/SirDavidLudwig/provium"
Issues = "https://github.com/SirDavidLudwig/provium/issues"
Repository = "https://github.com/SirDavidLudwig/provium"

[project.optional-dependencies]
graphviz = [
    "graphviz>=0.20",
]
mermaid = []
visualization = [
    "graphviz>=0.20",
]
yaml = [
    "PyYAML>=6,<7",
]
test = [
    "PyYAML>=6,<7",
    "build>=1.2",
    "pyright>=1.1.411",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.16",
]
docs = [
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
provium = ["py.typed"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=provium",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
testpaths = ["test"]
pythonpath = ["test"]

[tool.coverage.run]
branch = true
source = ["provium"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.pyright]
include = ["src", "typecheck"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "TRY", "UP"]
ignore = ["TRY003"]

[tool.ruff.lint.isort]
known-first-party = ["provium"]
