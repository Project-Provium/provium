name: Cloud live AWS tests

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - packages/provium/**
      - packages/provium-pipeline/**
      - packages/provium-cloud/**
      - examples/provium-text-pipeline/**
      - .github/workflows/cloud-live.yml

concurrency:
  group: provium-cloud-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.PROVIUM_CLOUD_LIVE_TESTS == 'true' &&
      vars.AWS_ROLE_ARN != '' && vars.AWS_REGION != '' &&
      vars.CLOUDFORMATION_ROLE_ARN != '' && vars.PROVIUM_CLOUD_TEST_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROVIUM_CLOUD_TEST_ACCOUNT_ID: ${{ vars.PROVIUM_CLOUD_TEST_ACCOUNT_ID }}
      CLOUDFORMATION_ROLE_ARN: ${{ vars.CLOUDFORMATION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/provium-cloud/infrastructure/aws/requirements.txt
      - name: Install harness dependencies
        run: python -m pip install -r packages/provium-cloud/infrastructure/aws/requirements.txt
      - name: Validate test infrastructure
        run: cfn-lint packages/provium-cloud/infrastructure/aws/stack.yaml
      - name: Authenticate to test account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.PROVIUM_CLOUD_TEST_ACCOUNT_ID }}
      - name: Provision, build, test, and tear down
        working-directory: packages/provium-cloud
        timeout-minutes: 70
        run: python -m infrastructure.aws run --results "$GITHUB_WORKSPACE/cloud-live-results"
      - name: Refresh credentials for recovery
        if: always() && hashFiles('cloud-live-results/state.json') != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.PROVIUM_CLOUD_TEST_ACCOUNT_ID }}
      - name: Recover cleanup
        if: always() && hashFiles('cloud-live-results/state.json') != ''
        working-directory: packages/provium-cloud
        timeout-minutes: 75
        run: python -m infrastructure.aws cleanup --results "$GITHUB_WORKSPACE/cloud-live-results"
      - name: Upload results and recovery journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-live-results
          path: cloud-live-results/
          if-no-files-found: ignore
          retention-days: 7
