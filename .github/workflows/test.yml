name: Tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-format:
    name: Lint and format check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check release configuration and workspace dependencies
        run: |
          python -m pip install PyYAML packaging
          python -m unittest discover -s .github/tests -v
      - name: Install lint and type-check dependencies
        run: python -m pip install -e "./packages/provium[test]" -e "./packages/provium-pipeline[test]" -e "./packages/provium-dispatch[test]"
      - name: Lint Provium
        working-directory: packages/provium
        run: ruff check src test typecheck
      - name: Check Provium formatting
        working-directory: packages/provium
        run: ruff format --check src test typecheck
      - name: Check Provium types
        working-directory: packages/provium
        run: python -m pyright
      - name: Lint pipeline package
        working-directory: packages/provium-pipeline
        run: ruff check src test
      - name: Check pipeline package formatting
        working-directory: packages/provium-pipeline
        run: ruff format --check src test
      - name: Check pipeline package types
        working-directory: packages/provium-pipeline
        run: python -m pyright
      - name: Lint dispatch package
        working-directory: packages/provium-dispatch
        run: ruff check src test
      - name: Check dispatch package formatting
        working-directory: packages/provium-dispatch
        run: ruff format --check src test
      - name: Check dispatch package types
        working-directory: packages/provium-dispatch
        run: python -m pyright
      - name: Check release workflow regression tests
        run: |
          ruff check --config packages/provium/pyproject.toml .github/tests
          ruff format --check .github/tests
      - name: Lint example pipeline
        working-directory: examples/provium-text-pipeline
        run: ruff check src test
      - name: Check example pipeline formatting
        working-directory: examples/provium-text-pipeline
        run: ruff format --check src test
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint-format
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install workspace packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./packages/provium[test]"
          python -m pip install -e "./examples/provium-text-pipeline[test]"
      - name: Run package tests
        working-directory: packages/provium
        run: pytest --cov-report=xml
      - name: Run example pipeline tests
        working-directory: examples/provium-text-pipeline
        run: pytest
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: packages/provium/coverage.xml
          flags: provium
          use_oidc: true

  pipeline-test:
    env:
      PROVIUM_TEST_DATABASE: postgresql://postgres:provium@localhost:5432/provium
      PROVIUM_TEST_S3: "1"
      AWS_ENDPOINT_URL_S3: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: provium
          POSTGRES_DB: provium
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      localstack:
        image: localstack/localstack:4
        env:
          SERVICES: s3
        ports: ["4566:4566"]
    name: Pipeline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint-format
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pipeline and workspace dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./packages/provium[test]" -e "./packages/provium-pipeline[test]" -e "./packages/provium-dispatch[test]" -e "./examples/provium-text-pipeline[test]"
      - name: Run pipeline package tests
        working-directory: packages/provium-pipeline
        run: python -m pytest --cov=provium_pipeline --cov-branch --cov-fail-under=100
      - name: Run dispatch package tests
        working-directory: packages/provium-dispatch
        run: python -m pytest --cov=provium_dispatch --cov-branch --cov-fail-under=100
